<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Inventario de casa{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topbar">
  <a href="{{ url_for('index') }}" class="brand">📦 Inventario</a>
  <nav>
    <a href="{{ url_for('index') }}">Habitaciones</a>
    <a href="{{ url_for('room_new') }}" class="btn-nav">+ Habitación</a>
    <a href="{{ url_for('box_new') }}" class="btn-nav">+ Caja</a>
    <a href="{{ url_for('item_new') }}" class="btn-nav">+ Objeto</a>
  </nav>
</header>

<main class="container">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="flashes">
        {% for category, message in messages %}
          <div class="flash flash-{{ category }}">{{ message }}</div>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  {% block content %}{% endblock %}
</main>
</body>
</html>
