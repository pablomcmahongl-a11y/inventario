{% macro icon(name, size=18) %}
<svg class="icon" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name == "home" %}
  <path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9h12v-9"/>
{%- elif name == "room" %}
  <rect x="3" y="4" width="18" height="16" rx="1.5"/><path d="M3 10h18"/><path d="M9 20v-6h6v6"/>
{%- elif name == "box" %}
  <path d="M3 8 12 4l9 4-9 4-9-4Z"/><path d="M3 8v9l9 4 9-4V8"/><path d="M12 12v9"/>
{%- elif name == "item" %}
  <rect x="4" y="7" width="16" height="13" rx="1.5"/><path d="M8 7V5.5A2.5 2.5 0 0 1 10.5 3h3A2.5 2.5 0 0 1 16 5.5V7"/>
{%- elif name == "search" %}
  <circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.6-4.6"/>
{%- elif name == "plus" %}
  <path d="M12 5v14M5 12h14"/>
{%- elif name == "edit" %}
  <path d="M4 20h4L18.5 9.5a2.1 2.1 0 0 0-3-3L5 17v3Z"/><path d="M14 6l4 4"/>
{%- elif name == "trash" %}

{%- elif name == "camera" %}
  <path d="M4 8h3l2-2h6l2 2h3v11H4Z"/><circle cx="12" cy="13.5" r="3.5"/>
{%- elif name == "qr" %}
  <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3h-3zM20 14v3M14 20h3M17.5 17.5h.01M20.5 20.5h.01"/>
{%- elif name == "download" %}
  <path d="M12 3v13"/><path d="m7 11 5 5 5-5"/><path d="M4 20h16"/>
{%- elif name == "history" %}
  <path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 8v4l3 2"/>
{%- elif name == "user" %}
  <circle cx="12" cy="8" r="3.5"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/>
{%- elif name == "logout" %}
  <path d="M9 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h3"/><path d="M14 8l4 4-4 4"/><path d="M18 12H9"/>
{%- elif name == "chevron-left" %}
  <path d="m15 5-7 7 7 7"/>
{%- elif name == "empty" %}
  <path d="M12 3 3 8v8l9 5 9-5V8Z"/><path d="M3 8l9 5 9-5"/><path d="M12 13v8"/>
{%- elif name == "chart" %}
  <path d="M4 20V10"/><path d="M11 20V4"/><path d="M18 20v-7"/><path d="M2 20h20"/>
{%- elif name == "package-open" %}
  <path d="M12 3 3 7.5 12 12l9-4.5Z"/><path d="M3 7.5V16l9 5 9-5V7.5"/><path d="M12 12v9"/>
{%- elif name == "map-pin" %}
  <path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.3"/>
{%- elif name == "check" %}
  <path d="m5 12 5 5 9-10"/>
{%- elif name == "minus" %}
  <path d="M5 12h14"/>
{%- elif name == "sun" %}
  <circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>
{%- endif %}
