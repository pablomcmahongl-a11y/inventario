services:
  inventario:
    build: .
    container_name: inventario
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      # Todos los valores (BASE_URL, SECRET_KEY, ADMIN_USERNAME,
      # ADMIN_PASSWORD_HASH...) se definen en .env, no versionado.
      # Usa .env.example como plantilla.
      - .env
    volumes:
      - ./data/uploads:/app/uploads
      - ./data/instance:/app/instance
